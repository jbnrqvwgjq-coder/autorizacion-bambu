<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Autorización Bambú</title>

<script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>

<style>

body{
  font-family:Arial,sans-serif;
  max-width:900px;
  margin:auto;
  padding:15px;
  background:#f5f5f5;
}

h2{
  text-align:center;
}

h3{
  background:#e9ecef;
  padding:10px;
  border-radius:8px;
}

label{
  display:block;
  margin-top:8px;
  font-weight:bold;
}

input,
select{
  width:100%;
  padding:14px;
  font-size:16px;
  margin-bottom:10px;
  border:1px solid #ccc;
  border-radius:8px;
  box-sizing:border-box;
}

button{
  width:100%;
  padding:18px;
  font-size:18px;
  font-weight:bold;
  border:none;
  border-radius:10px;
  background:#0066cc;
  color:white;
  cursor:pointer;
}

hr{
  margin:25px 0;
}

</style>

</head>

<body>

<h2>Autorización Hacienda Peñalisa Bambú</h2>

<label>Fecha</label>
<input id="fecha">

<label>Desde</label>
<input id="desde">

<label>Hasta</label>
<input id="hasta">

<label>Vehículo</label>
<select id="vehiculo">
  <option value="SI">Sí</option>
  <option value="NO">No</option>
</select>

<label>Placa</label>
<input id="placa">

<hr>

<h3>Visitante 1</h3>

<label>Nombre</label>
<input id="nombre1">

<label>Identificación</label>
<input id="identificacion1">

<label>Parentesco</label>
<input id="parentesco1">

<label>Celular</label>
<input id="celular1">

<label>Mascota</label>
<input id="mascota1">

<hr>

<h3>Visitante 2</h3>

<label>Nombre</label>
<input id="nombre2">

<label>Identificación</label>
<input id="identificacion2">

<label>Parentesco</label>
<input id="parentesco2">

<label>Celular</label>
<input id="celular2">

<label>Mascota</label>
<input id="mascota2">

<hr>

<h3>Visitante 3</h3>

<label>Nombre</label>
<input id="nombre3">

<label>Identificación</label>
<input id="identificacion3">

<label>Parentesco</label>
<input id="parentesco3">

<label>Celular</label>
<input id="celular3">

<label>Mascota</label>
<input id="mascota3">

<button onclick="generarPDF()">
Generar PDF
</button>

<script>

window.onload = function(){

  const hoy = new Date();

  const fecha =
    String(hoy.getDate()).padStart(2,'0')
    + '/'
    + String(hoy.getMonth()+1).padStart(2,'0')
    + '/'
    + hoy.getFullYear();

  document.getElementById('fecha').value = fecha;

};

async function generarPDF(){

const pdfBytes =
await fetch("bambu.pdf")
.then(r => r.arrayBuffer());

const pdfDoc =
await PDFLib.PDFDocument.load(pdfBytes);

const form =
pdfDoc.getForm();


// ENCABEZADO

form.getTextField("dhFormfield-6676099507")
.setText(document.getElementById("fecha").value);

form.getTextField("dhFormfield-6676099829")
.setText(document.getElementById("desde").value);

form.getTextField("dhFormfield-6676099872")
.setText(document.getElementById("hasta").value);

form.getTextField("dhFormfield-6676100870")
.setText(document.getElementById("placa").value);


// VISITANTE 1

form.getTextField("dhFormfield-6676099881")
.setText(document.getElementById("nombre1").value);

form.getTextField("dhFormfield-6676099961")
.setText(document.getElementById("identificacion1").value);

form.getTextField("dhFormfield-6676100002")
.setText(document.getElementById("parentesco1").value);

form.getTextField("dhFormfield-6676100201")
.setText(document.getElementById("celular1").value);

form.getTextField("dhFormfield-6676100870")
.setText(document.getElementById("mascota1").value);


// VISITANTE 2

form.getTextField("dhFormfield-6676099893")
.setText(document.getElementById("nombre2").value);

form.getTextField("dhFormfield-6676099978")
.setText(document.getElementById("identificacion2").value);

form.getTextField("dhFormfield-6676100007")
.setText(document.getElementById("parentesco2").value);

form.getTextField("dhFormfield-6676100202")
.setText(document.getElementById("celular2").value);


// VISITANTE 3

form.getTextField("dhFormfield-6676099899")
.setText(document.getElementById("nombre3").value);

form.getTextField("dhFormfield-6676099981")
.setText(document.getElementById("identificacion3").value);

form.getTextField("dhFormfield-6676100011")
.setText(document.getElementById("parentesco3").value);

form.getTextField("dhFormfield-6676100235")
.setText(document.getElementById("celular3").value);


const pdfFinal =
await pdfDoc.save();

const blob =
new Blob(
[pdfFinal],
{type:"application/pdf"}
);

const url =
URL.createObjectURL(blob);

const a =
document.createElement("a");

a.href = url;
a.download = "Autorizacion_Bambu.pdf";

a.click();

}

</script>

</body>
</html>
