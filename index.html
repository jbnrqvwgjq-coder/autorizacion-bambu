<button onclick="generarPDF()">
Generar PDF
</button>

<script>
async function generarPDF() {

  try {

    const pdfBytes = await fetch("bambu.pdf")
      .then(r => r.arrayBuffer());

    alert("PDF encontrado correctamente");

  } catch (error) {

    alert("No puedo encontrar bambu.pdf");

  }

}
</script>
