<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Autorización Bambú</title>

<script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>

<style>

body{
    font-family:Arial,sans-serif;
    max-width:900px;
    margin:o;
    padding:15px;
    background:#f5f5f5;
}

h2{
    text-align:center;
}

h3{
    background:#e9ecef;
    padding:10px;
    border-radius:8px;
}

label{
    display:block;
    margin-top:8px;
    font-weight:bold;
}

input,
select{
    width:100%;
    padding:14px;
    font-size:16px;
    margin-bottom:10px;
    border:1px solid #ccc;
    border-radius:8px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:18px;
    font-size:18px;
    font-weight:bold;
    border:none;
    border-radius:10px;
    background:#0066cc;
    color:white;
    cursor:pointer;
}

hr{
    margin:25px 0;
}

</style>

</head>

<body>

<div style="text-align:center;margin-bottom:20px;">
    <h1 style="
        color:#2e7d32;
        margin-bottom:5px;
    ">
        HACIENDA PEÑALISA BAMBÚ
    </h1>

    <div style="
        color:#666;
        font-size:14px;
    ">
        Generador de Autorizaciones
    </div>
</div>

<label>Fecha</label>
<input id="fecha">

<label>Desde</label>
<input id="desde">

<label>Hasta</label>
<input id="hasta">

<label>Vehículo</label>
<select id="vehiculo">
    <option value="SI">Sí</option>
    <option value="NO">No</option>
</select>

<label>Placa</label>
<input id="placa">

<hr>

<h3>Visitante 1</h3>

<label>Nombre</label>
<input id="nombre1">

<label>Identificación</label>
<input id="identificacion1">

<label>Celular</label>
<input id="celular1">

<label>Mascota</label>
<input id="mascota1">

<hr>

<h3>Visitante 2</h3>

<label>Nombre</label>
<input id="nombre2">

<label>Identificación</label>
<input id="identificacion2">

<hr>

<h3>Visitante 3</h3>

<label>Nombre</label>
<input id="nombre3">

<label>Identificación</label>
<input id="identificacion3">

<hr>

<h3>Visitante 4</h3>

<label>Nombre</label>
<input id="nombre4">

<label>Identificación</label>
<input id="identificacion4">

<hr>

<h3>Visitante 5</h3>

<label>Nombre</label>
<input id="nombre5">

<label>Identificación</label>
<input id="identificacion5">

<hr>

<h3>Visitante 6</h3>

<label>Nombre</label>
<input id="nombre6">

<label>Identificación</label>
<input id="identificacion6">

<hr>

<h3>Visitante 7</h3>

<label>Nombre</label>
<input id="nombre7">

<label>Identificación</label>
<input id="identificacion7">

<button onclick="generarPDF()">
Generar PDF
</button>

<script>

window.onload = function(){

    const hoy = new Date();

    const fecha =
        String(hoy.getDate()).padStart(2,'0') +
        '/' +
        String(hoy.getMonth()+1).padStart(2,'0') +
        '/' +
        hoy.getFullYear();

    document.getElementById("fecha").value = fecha;
};

async function generarPDF(){

    const pdfBytes =
        await fetch("bambu.pdf")
        .then(r => r.arrayBuffer());

    const pdfDoc =
        await PDFLib.PDFDocument.load(pdfBytes);

    const form =
        pdfDoc.getForm();

    // FECHA
    form.getTextField("dhFormfield-6676099507")
        .setText(document.getElementById("fecha").value);

    // DESDE
    form.getTextField("dhFormfield-6676099829")
        .setText(document.getElementById("desde").value);

    // HASTA
    form.getTextField("dhFormfield-6676099872")
        .setText(document.getElementById("hasta").value);

    // PLACA
    form.getTextField("dhFormfield-6676100870")
        .setText(document.getElementById("placa").value);

    // VEHICULO

    const vehiculo =
      document.getElementById("vehiculo").value;

    if(vehiculo === "SI"){

        form.getTextField("dhFormfield-6676100911")
            .setText("X");

        form.getTextField("dhFormfield-6676101056")
            .setText("");

    }else{

        form.getTextField("dhFormfield-6676100911")
            .setText("");

        form.getTextField("dhFormfield-6676101056")
            .setText("X");

    }

    // VISITANTE 1

    form.getTextField("dhFormfield-6676099881")
        .setText(document.getElementById("nombre1").value);

    form.getTextField("dhFormfield-6676099961")
        .setText(document.getElementById("identificacion1").value);

    form.getTextField("dhFormfield-6676100201")
        .setText(document.getElementById("celular1").value);

    form.getTextField("dhFormfield-6676100253")
        .setText(document.getElementById("mascota1").value);

    // VISITANTE 2

    form.getTextField("dhFormfield-6676099893")
        .setText(document.getElementById("nombre2").value);

    form.getTextField("dhFormfield-6676099978")
        .setText(document.getElementById("identificacion2").value);

    // VISITANTE 3

    form.getTextField("dhFormfield-6676099899")
        .setText(document.getElementById("nombre3").value);

    form.getTextField("dhFormfield-6676099981")
        .setText(document.getElementById("identificacion3").value);
    // VISITANTE 4

form.getTextField("dhFormfield-6676099902")
.setText(document.getElementById("nombre4").value);

form.getTextField("dhFormfield-6676099983")
.setText(document.getElementById("identificacion4").value);


// VISITANTE 5

form.getTextField("dhFormfield-6676099906")
.setText(document.getElementById("nombre5").value);

form.getTextField("dhFormfield-6676099991")
.setText(document.getElementById("identificacion5").value);


// VISITANTE 6

form.getTextField("dhFormfield-6676099919")
.setText(document.getElementById("nombre6").value);

form.getTextField("dhFormfield-6676099994")
.setText(document.getElementById("identificacion6").value);


// VISITANTE 7

form.getTextField("dhFormfield-6676099924")
.setText(document.getElementById("nombre7").value);

form.getTextField("dhFormfield-6676099999")
.setText(document.getElementById("identificacion7").value);

    const pdfFinal =
        await pdfDoc.save();

    const blob =
        new Blob(
            [pdfFinal],
            { type:"application/pdf" }
        );

    const url =
        URL.createObjectURL(blob);

    const a =
        document.createElement("a");

    a.href = url;
    a.download = "Autorizacion_Bambu.pdf";

    a.click();
}

</script>

</body>
</html>
